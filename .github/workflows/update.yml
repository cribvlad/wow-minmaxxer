name: Обновить статусы

on:
  schedule:
    - cron: "17 */6 * * *"   # каждые 6 часов
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[add]') || startsWith(github.event.issue.title, '[remove]') || startsWith(github.event.issue.title, '[refresh]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Собрать данные
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update.py
      - name: Сохранить изменения
        run: |
          git config user.name "minmaxxer-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Данные: обновление $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
